name: Build and publish Lunarune release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish standalone Windows app
        shell: pwsh
        run: >-
          dotnet publish .\Lunarune.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Package portable ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path .\publish\* -DestinationPath ".\Lunarune-$env:RELEASE_TAG-win-x64.zip" -Force

      - name: Create GitHub Release with downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG ".\publish\Lunarune.exe" ".\Lunarune-$env:RELEASE_TAG-win-x64.zip" --generate-notes --verify-tag --title "Lunarune $env:RELEASE_TAG"
